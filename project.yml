name: SplateVPN
options:
  bundleIdPrefix: com.danieldk
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  SplateVPN:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieldk.splatevpn
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SplateVPN.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: SplateWidget
        embed: true
      - framework: Frameworks/SplateCore.xcframework
        embed: true

  SplateWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared/AppGroup.swift
      - path: Shared/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieldk.splatevpn.Widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/SplateWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: NetworkExtension.framework

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danieldk.splatevpn.PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - framework: Frameworks/SplateCore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
