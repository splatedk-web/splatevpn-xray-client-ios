name: Build SplateVPN iOS (.IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build SplateVPN App & Extensions
        run: |
          xcodebuild clean build \
            -project SplateVPN.xcodeproj \
            -scheme SplateVPN \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into SplateVPN.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SplateVPN.app Payload/
          zip -r SplateVPN-unsigned.ipa Payload
          echo "IPA packaging complete!"
          ls -lh SplateVPN-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplateVPN-iOS-Package
          path: SplateVPN-unsigned.ipa
          retention-days: 14
